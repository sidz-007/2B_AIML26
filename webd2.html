<!DOCTYPE html>
<html lang="en">
<head>
<script>
    function sum(){
        let age = parseInt(prompt("Enter value of a: "));
        if (age >= 18) {
            // alert("You are eligible to vote."); document.write, console.log, alert
            let c = confirm("Do you want to proceed?");
            if(c){
                alert("Your vote has been recorded.");
            }
            else{
                alert("You have cancelled the voting process.");
            }
        } else {
            alert("You are not eligible to vote.");
        }
    }
</script>
</head>
<body>
    <input type="button" value="Check Eligibility" onclick="sum()">
</body>
</html>
